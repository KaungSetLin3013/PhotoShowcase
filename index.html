<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" href="icons/favicon.ico?v=2" sizes="48x48"/>
<link rel="icon" type="image/svg+xml" href="icons/favicon.svg?v=2"/>
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png?v=2"/>
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16x16.png?v=2"/>
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png?v=2"/>
<link rel="manifest" href="icons/site.webmanifest"/>
<meta name="theme-color" content="#111314"/>
<meta name="msapplication-TileColor" content="#111314"/>
<meta name="msapplication-config" content="icons/browserconfig.xml"/>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Framed — Photo Showcase</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Noto+Sans+JP:wght@400;600&family=Fira+Code:wght@400&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --ink:#111314;        /* Black, No.190 */
    --paper:#ebd3a2;      /* Ivory Buff, No.190 */
    --accent:#d96629;     /* English Red, No.190 */
    --red:#f37f94;        /* Eosine Pink, No.276 (danger) */
    --on-accent:var(--ink);
    --accent2:color-mix(in srgb,var(--accent) 82%,var(--paper));
    --bg:var(--ink);
    --surf:color-mix(in srgb,var(--paper) 5%,var(--ink));
    --surf2:color-mix(in srgb,var(--paper) 9%,var(--ink));
    --surf3:color-mix(in srgb,var(--paper) 14%,var(--ink));
    --surf4:color-mix(in srgb,var(--paper) 19%,var(--ink));
    --border:color-mix(in srgb,var(--paper) 18%,var(--ink));
    --text:var(--paper);
    --muted:color-mix(in srgb,var(--paper) 70%,var(--ink));
    --gold:var(--accent);
    --gold-dim:color-mix(in srgb,var(--accent) 14%,transparent);
    --shadow:color-mix(in srgb,var(--ink) 60%,transparent);
    --card-min:195px; color-scheme:dark;
  }
  [data-theme=slate]{--ink:#112f2c;--paper:#fbe6a0;--accent:#f48067}
  [data-theme=olive]{--ink:#253122;--paper:#f5ecc2;--accent:#97acc8}

  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font-family: 'Fira Code', monospace; font-size: 13px;
    min-height: 100vh; overflow-x: hidden;
  }
  body::after {
    content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 9999;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.055'/%3E%3C/svg%3E");
    opacity: 0.45;
  }

  /* ── HEADER ── */
  header {
    position: sticky; top: 0; z-index: 100; overflow: hidden;
    display: flex; align-items: center; flex-wrap: wrap; gap: 1.2rem;
    padding: 1.3rem 2.2rem;
    background: var(--surf); border-bottom: 1px solid var(--border);
  }
  header::before {
    content: ''; position: absolute; top: -70px; left: 90px; width: 340px; height: 220px;
    background: radial-gradient(circle, color-mix(in srgb,var(--accent) 9%,transparent), transparent 70%);
    pointer-events: none;
  }
  .logo { position: relative; font-family: 'Cormorant Garamond', serif; font-size: 1.85rem; font-weight: 600; letter-spacing: -0.01em; line-height: 1; }
  .logo em { color: var(--gold); font-style: normal; }
  .tagline { position: relative; font-size: 0.58rem; letter-spacing: 0.22em; text-transform: none; color: var(--muted); }
  .header-right { position: relative; margin-left: auto; display: flex; gap: 0.6rem; align-items: center; flex-wrap: wrap; }

  /* ── BUTTONS ── */
  button {
    font-family: 'Fira Code', monospace; font-size: 0.67rem; letter-spacing: 0.1em; text-transform: none;
    padding: 0.52rem 1rem; border: 1px solid var(--border); background: var(--surf2); color: var(--text);
    cursor: pointer; transition: all 0.17s; white-space: nowrap;
  }
  button:hover { background: var(--surf3); border-color: color-mix(in srgb,var(--paper) 14%,transparent); }
  button.primary { background: var(--gold); border-color: var(--gold); color: var(--on-accent); font-weight: 600; }
  button.primary:hover { background: var(--accent2); border-color: var(--accent2); }
  button.danger { background: color-mix(in srgb,var(--red) 10%,transparent); border-color: color-mix(in srgb,var(--red) 40%,transparent); color: var(--red); }
  button.danger:hover { background: var(--red); border-color: var(--red); color: var(--paper); }

  #btn-random {
    background: var(--gold-dim); border-color: color-mix(in srgb,var(--accent) 28%,transparent); color: var(--gold);
    display: flex; align-items: center; gap: 0.45rem;
  }
  #btn-random:hover { background: var(--gold); color: var(--on-accent); border-color: var(--gold); }
  #btn-random .dice { display: inline-block; font-size: 0.95rem; transition: transform 0.35s cubic-bezier(0.34,1.56,0.64,1); }
  #btn-random:hover .dice { transform: rotate(180deg) scale(1.2); }
  #btn-random.spinning .dice { animation: spinDice 0.38s ease forwards; }
  @keyframes spinDice { from { transform: rotate(0deg) scale(1.3); } to { transform: rotate(360deg) scale(1); } }

  .vdiv { width: 1px; height: 1.3rem; background: var(--border); }

  /* ── STATS BAR ── */
  #stats-bar {
    display: none; align-items: center; gap: 2rem; flex-wrap: wrap;
    padding: 0.65rem 2.2rem;
    background: var(--surf); border-bottom: 1px solid var(--border);
    font-size: 0.58rem; letter-spacing: 0.13em; text-transform: none; color: var(--muted);
  }
  #stats-bar.visible { display: flex; }
  .stat-val { font-family: 'Cormorant Garamond', serif; font-size: 1rem; color: var(--gold); margin-right: 0.3rem; }

  /* ── MAIN ── */
  main { padding: 1.8rem 2.2rem 4rem; }

  /* ── SECTION HEADER ── */
  .sec-header {
    display: flex; align-items: center; gap: 0.9rem; flex-wrap: wrap;
    margin-bottom: 1.3rem; padding-bottom: 0.65rem; border-bottom: 1px solid var(--border);
  }
  .sec-title { font-family: 'Cormorant Garamond', serif; font-size: 1.25rem; font-weight: 400; }
  .sec-count { font-size: 0.58rem; color: var(--muted); letter-spacing: 0.1em; }

  /* ── SEARCH ── */
  .search-wrap { position: relative; display: flex; align-items: center; }
  .search-icon { position: absolute; left: 0.6rem; font-size: 0.68rem; opacity: 0.4; pointer-events: none; }
  .search-input {
    font-family: 'Fira Code', monospace; font-size: 0.64rem; letter-spacing: 0.03em;
    background: var(--surf2); border: 1px solid var(--border); color: var(--text);
    padding: 0.42rem 0.6rem 0.42rem 1.7rem; width: 140px; transition: all 0.2s;
  }
  .search-input::placeholder { color: var(--muted); }
  .search-input:focus { outline: none; border-color: var(--gold); width: 190px; background: var(--surf3); }

  /* ── SORT / DENSITY CONTROLS ── */
  .sort-bar { display: flex; align-items: center; gap: 0.4rem; margin-left: auto; flex-wrap: wrap; }
  .sort-label { font-size: 0.55rem; letter-spacing: 0.13em; text-transform: none; color: var(--muted); padding-right: 0.2rem; }
  .sort-btn, .density-btn {
    font-family: 'Fira Code', monospace; font-size: 0.58rem; letter-spacing: 0.07em; text-transform: none;
    padding: 0.28rem 0.62rem; border: 1px solid var(--border); background: transparent;
    color: var(--muted); cursor: pointer; transition: all 0.15s; white-space: nowrap;
  }
  .sort-btn:hover, .density-btn:hover { border-color: color-mix(in srgb,var(--paper) 16%,transparent); color: var(--text); background: var(--surf3); }
  .sort-btn.active, .density-btn.active { border-color: var(--gold); color: var(--gold); background: var(--gold-dim); }
  .sort-dir {
    font-family: 'Fira Code', monospace; font-size: 0.82rem; line-height: 1;
    padding: 0.26rem 0.5rem; border: 1px solid var(--border); background: transparent;
    color: var(--muted); cursor: pointer; transition: all 0.15s; user-select: none;
  }
  .sort-dir:hover { border-color: color-mix(in srgb,var(--paper) 16%,transparent); color: var(--text); }
  .sort-dir.active { border-color: var(--gold); color: var(--gold); }

  /* ── GALLERY ── */
  #gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--card-min), 1fr)); gap: 1.1rem; }

  .photo-card { position: relative; cursor: pointer; animation: cardIn 0.4s ease both; }
  @keyframes cardIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  .photo-frame {
    aspect-ratio: 4/3; overflow: hidden; position: relative;
    border: 1px solid var(--border); box-shadow: 0 4px 22px var(--shadow);
    transition: all 0.22s;
    background: linear-gradient(100deg, var(--surf2) 25%, var(--surf3) 45%, var(--surf2) 65%);
    background-size: 220% 100%;
    animation: shimmer 1.6s ease-in-out infinite;
  }
  .photo-card.loaded .photo-frame { animation: none; background: var(--surf2); }
  @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

  .photo-card:hover .photo-frame { transform: translateY(-4px); box-shadow: 0 14px 40px var(--shadow); border-color: color-mix(in srgb,var(--paper) 12%,transparent); }
  .photo-frame img {
    width: 100%; height: 100%; object-fit: cover; display: block;
    opacity: 0; transition: opacity 0.35s ease, transform 0.4s;
  }
  .photo-card.loaded .photo-frame img { opacity: 1; }
  .photo-card:hover .photo-frame img { transform: scale(1.06); }
  .photo-overlay {
    position: absolute; inset: 0;
    background: linear-gradient(to top, color-mix(in srgb,var(--ink) 88%,transparent) 0%, transparent 55%);
    opacity: 0; transition: opacity 0.25s;
    display: flex; flex-direction: column; justify-content: flex-end; padding: 0.8rem;
  }
  .photo-card:hover .photo-overlay { opacity: 1; }
  .po-name { font-size: 0.62rem; color: color-mix(in srgb,var(--paper) 88%,transparent); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-bottom: 0.45rem; }
  .po-actions { display: flex; gap: 0.35rem; }
  .po-btn {
    font-family: 'Fira Code', monospace; font-size: 0.6rem; letter-spacing: 0.08em; text-transform: none;
    padding: 0.22rem 0.48rem; cursor: pointer; border: 1px solid color-mix(in srgb,var(--paper) 20%,transparent);
    background: color-mix(in srgb,var(--paper) 8%,transparent); color: color-mix(in srgb,var(--paper) 82%,transparent); transition: all 0.17s;
  }
  .po-btn:hover { background: color-mix(in srgb,var(--paper) 22%,transparent); }
  .po-btn.del:hover { background: var(--red); border-color: var(--red); color: var(--paper); }
  .photo-meta { margin-top: 0.42rem; }
  .photo-meta p { font-size: 0.57rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; line-height: 1.6; }

  /* ── EMPTY / NO RESULTS ── */
  #empty, #no-results { text-align: center; padding: 4rem 2rem; display: none; }
  #empty.visible, #no-results.visible { display: block; }
  #empty .e-icon, #no-results .e-icon { font-size: 2.8rem; opacity: 0.22; display: block; margin-bottom: 1.1rem; }
  #empty .e-title, #no-results .e-title { font-family: 'Cormorant Garamond', serif; font-size: 1.3rem; color: var(--muted); margin-bottom: 0.4rem; }
  #empty .e-sub, #no-results .e-sub { font-size: 0.58rem; letter-spacing: 0.15em; text-transform: none; color: var(--muted); opacity: 0.55; }

  #scroll-sentinel { height: 1px; width: 100%; }

  /* ── LIGHTBOX ── */
  #lightbox {
    display: none; position: fixed; inset: 0; z-index: 500;
    background: color-mix(in srgb,var(--ink) 94%,transparent); align-items: center; justify-content: center;
  }
  #lightbox.open { display: flex; animation: lbFadeIn 0.18s ease; }
  @keyframes lbFadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes popIn { 0% { opacity:0; transform:scale(0.83) rotate(-2.5deg); } 100% { opacity:1; transform:scale(1) rotate(0deg); } }
  @keyframes slideUp { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:translateY(0); } }

  #lb-bgblur {
    position: absolute; inset: 0; background-size: cover; background-position: center;
    filter: blur(46px) brightness(0.32) saturate(1.15); transform: scale(1.15);
    transition: background-image 0.25s ease; z-index: 0;
  }
  #lb-bg { position: absolute; inset: 0; cursor: zoom-out; z-index: 0; }
  #lb-inner {
    position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center;
    max-width: 92vw; animation: popIn 0.3s cubic-bezier(0.34,1.56,0.64,1);
  }
  #lb-img { max-width: 82vw; max-height: 72vh; object-fit: contain; display: block; box-shadow: 0 40px 100px color-mix(in srgb,var(--ink) 90%,transparent), 0 0 0 1px color-mix(in srgb,var(--paper) 5%,transparent); background: var(--surf2); }
  #lb-footer { display: flex; align-items: center; gap: 1.4rem; margin-top: 1.3rem; }
  .lb-nav {
    width: 2.8rem; height: 2.8rem; background: color-mix(in srgb,var(--paper) 6%,transparent); border: 1px solid color-mix(in srgb,var(--paper) 12%,transparent);
    color: color-mix(in srgb,var(--paper) 75%,transparent); font-size: 1.1rem; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Fira Code', monospace; transition: all 0.17s; user-select: none;
  }
  .lb-nav:hover { background: color-mix(in srgb,var(--paper) 18%,transparent); color: var(--paper); transform: scale(1.1); }
  #lb-caption { text-align: center; min-width: 150px; font-size: 0.58rem; letter-spacing: 0.13em; text-transform: none; color: color-mix(in srgb,var(--paper) 38%,transparent); }
  #lb-caption strong { display: block; color: color-mix(in srgb,var(--paper) 72%,transparent); margin-bottom: 0.2rem; font-weight: 400; font-style: normal; font-family: 'Cormorant Garamond', serif; font-size: 0.9rem; text-transform: none; letter-spacing: 0; }
  #lb-rand {
    background: var(--gold-dim); border: 1px solid color-mix(in srgb,var(--accent) 28%,transparent); color: var(--gold);
    font-family: 'Fira Code', monospace; font-size: 0.72rem; letter-spacing: 0.1em; text-transform: none;
    padding: 0 0.9rem; height: 2.8rem; cursor: pointer; display: flex; align-items: center; gap: 0.4rem;
    transition: all 0.17s; user-select: none; white-space: nowrap;
  }
  #lb-rand:hover { background: var(--gold); color: var(--on-accent); border-color: var(--gold); }
  #lb-rand .dice { display: inline-block; font-size: 0.9rem; transition: transform 0.35s cubic-bezier(0.34,1.56,0.64,1); }
  #lb-rand:hover .dice { transform: rotate(180deg) scale(1.2); }
  #lb-rand.spinning .dice { animation: spinDice 0.38s ease forwards; }

  #lb-close {
    position: fixed; top: 1.4rem; right: 1.4rem; width: 2.3rem; height: 2.3rem;
    background: color-mix(in srgb,var(--paper) 5%,transparent); border: 1px solid color-mix(in srgb,var(--paper) 10%,transparent);
    color: color-mix(in srgb,var(--paper) 55%,transparent); font-size: 0.9rem; cursor: pointer;
    display: flex; align-items: center; justify-content: center; transition: all 0.17s; z-index: 10;
  }
  #lb-close:hover { background: color-mix(in srgb,var(--paper) 14%,transparent); color: var(--paper); }

  /* ── RANDOM MODE (TikTok-style vertical feed) ── */
  #random-mode {
    display: none; position: fixed; inset: 0; z-index: 800;
    background: var(--ink); overflow: hidden; touch-action: none;
  }
  #random-mode.open { display: block; animation: lbFadeIn 0.16s ease; }

  .rm-slide {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    transition: transform 0.34s cubic-bezier(0.22,1,0.36,1), opacity 0.34s ease;
    transform: translateY(0); opacity: 1;
  }
  .rm-slide.enter-from-bottom, .rm-slide.exit-to-bottom { transform: translateY(100%); opacity: 0; }
  .rm-slide.enter-from-top,    .rm-slide.exit-to-top    { transform: translateY(-100%); opacity: 0; }

  .rm-bgblur {
    position: absolute; inset: 0; background-size: cover; background-position: center;
    filter: blur(50px) brightness(0.3) saturate(1.15); transform: scale(1.15);
  }
  .rm-img {
    position: relative; z-index: 1; max-width: 92vw; max-height: 82vh; object-fit: contain;
    box-shadow: 0 30px 90px color-mix(in srgb,var(--ink) 80%,transparent); opacity: 0; transition: opacity 0.25s ease;
  }
  .rm-img.loaded { opacity: 1; }

  #rm-track { position: absolute; inset: 0; }

  #rm-caption {
    position: absolute; left: 0; right: 0; bottom: 2.6rem; z-index: 5;
    text-align: center; pointer-events: none;
  }
  #rm-caption strong {
    display: block; color: color-mix(in srgb,var(--paper) 85%,transparent); font-weight: 400; font-style: normal;
    font-family: 'Cormorant Garamond', serif; font-size: 1.05rem; margin-bottom: 0.35rem;
    text-shadow: 0 2px 12px color-mix(in srgb,var(--ink) 60%,transparent);
  }
  #rm-hint {
    font-size: 0.56rem; letter-spacing: 0.16em; text-transform: none; color: color-mix(in srgb,var(--paper) 40%,transparent);
  }
  #rm-close {
    position: fixed; top: 1.4rem; right: 1.4rem; z-index: 810; width: 2.3rem; height: 2.3rem;
    background: color-mix(in srgb,var(--paper) 8%,transparent); border: 1px solid color-mix(in srgb,var(--paper) 14%,transparent);
    color: color-mix(in srgb,var(--paper) 70%,transparent); font-size: 0.9rem; cursor: pointer;
    display: flex; align-items: center; justify-content: center; transition: all 0.17s;
  }
  #rm-close:hover { background: color-mix(in srgb,var(--paper) 18%,transparent); color: var(--paper); }

  /* ── CONFIRM MODAL ── */
  #confirm-overlay {
    display: none; position: fixed; inset: 0; z-index: 600;
    background: color-mix(in srgb,var(--ink) 78%,transparent); align-items: center; justify-content: center;
  }
  #confirm-overlay.open { display: flex; animation: lbFadeIn 0.15s ease; }
  #confirm-box {
    background: var(--surf2); border: 1px solid var(--border);
    padding: 2rem 2.2rem; max-width: 340px; width: 90%;
    box-shadow: 0 30px 80px color-mix(in srgb,var(--ink) 70%,transparent); animation: slideUp 0.2s ease;
  }
  #confirm-box h3 { font-family: 'Cormorant Garamond', serif; font-size: 1.15rem; margin-bottom: 0.55rem; font-weight: 600; }
  #confirm-box p { font-size: 0.65rem; color: var(--muted); line-height: 1.7; margin-bottom: 1.4rem; }
  .confirm-actions { display: flex; gap: 0.65rem; justify-content: flex-end; }

  /* ── PROGRESS ── */
  #progress-wrap {
    display: none; position: fixed; bottom: 0; left: 0; right: 0; z-index: 400;
    background: var(--surf2); border-top: 1px solid var(--border);
    padding: 0.65rem 2.2rem; gap: 1rem; align-items: center; animation: slideUp 0.2s ease;
  }
  #progress-wrap.visible { display: flex; }
  #progress-label { font-size: 0.6rem; letter-spacing: 0.1em; color: var(--muted); white-space: nowrap; }
  #progress-track { flex: 1; height: 2px; background: var(--border); }
  #progress-fill { height: 100%; background: var(--gold); transition: width 0.14s ease; width: 0%; }
  #progress-count { font-size: 0.6rem; color: var(--gold); white-space: nowrap; min-width: 55px; text-align: right; }

  /* ── TOAST ── */
  #toast {
    display: none; position: fixed; bottom: 2rem; right: 2rem; z-index: 700;
    background: var(--surf2); color: var(--text); border: 1px solid var(--border); border-left: 3px solid var(--gold);
    font-size: 0.65rem; letter-spacing: 0.07em; padding: 0.7rem 1.3rem;
    box-shadow: 0 8px 30px color-mix(in srgb,var(--ink) 50%,transparent); animation: slideUp 0.22s ease; max-width: 280px;
  }
  #toast.visible { display: block; }

  /* ── Wada palette + UX playbook + Jakob's Law ── */
  body{font-family:'Noto Sans JP',system-ui,sans-serif;font-size:16px;line-height:1.5}
  :focus-visible{outline:3px solid var(--accent);outline-offset:3px}
  .i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
  header{padding:8px 24px;min-height:72px;gap:16px}
  .logo{text-decoration:none;color:inherit;font-size:2rem}
  .tagline{font-size:14px;letter-spacing:0}
  .search-wrap{flex:1;max-width:420px;min-width:160px}
  .search-icon{left:16px;opacity:.75;display:flex}
  .search-icon .i{width:20px;height:20px}
  .search-input,.search-input:focus{width:100%;min-height:48px;padding:0 16px 0 48px;font:16px 'Noto Sans JP',sans-serif;letter-spacing:0;border-radius:24px}
  .search-input:focus{border-color:var(--accent)}
  .header-right{gap:8px}
  button{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 24px;border-radius:24px;font:600 17px/1 'Noto Sans JP',sans-serif;letter-spacing:0;transition:background-color .1s,border-color .1s,color .1s,transform .1s}
  button:active{transform:translateY(1px)}
  button.danger,button.danger:hover{color:var(--red)}
  button.danger:hover,.po-btn.del:hover{background:var(--red);border-color:var(--red);color:var(--ink)}
  #btn-random{font-size:17px}
  #btn-random,#lb-rand{padding:0 20px}

<script>
  // ══════════════════════════════════════════════════════════
  // Storage: IndexedDB (works on GitHub Pages / any static host,
  // persists between visits, no server required).
  //   store "meta"  → lightweight records (id, name, size, date, seq)
  //   store "blobs" → { id, thumb: Blob, full: Blob }  fetched on demand
  // ══════════════════════════════════════════════════════════
  const DB_NAME = 'framed-db', DB_VERSION = 1;
  let db;

  function openDB() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = e => {
        const d = e.target.result;
        if (!d.objectStoreNames.contains('meta'))  d.createObjectStore('meta',  { keyPath: 'id' });
        if (!d.objectStoreNames.contains('blobs')) d.createObjectStore('blobs', { keyPath: 'id' });
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror   = () => reject(req.error);
    });
  }
  function idbGetAll(store) {
    return new Promise((resolve, reject) => {
      const req = db.transaction(store, 'readonly').objectStore(store).getAll();
      req.onsuccess = () => resolve(req.result);
      req.onerror   = () => reject(req.error);
    });
  }
  function idbGet(store, id) {
    return new Promise((resolve, reject) => {
      const req = db.transaction(store, 'readonly').objectStore(store).get(id);
      req.onsuccess = () => resolve(req.result);
      req.onerror   = () => reject(req.error);
    });
  }
  function idbDelete(store, id) {
    return new Promise((resolve, reject) => {
      const tx = db.transaction(store, 'readwrite');
      tx.objectStore(store).delete(id);
      tx.oncomplete = resolve; tx.onerror = () => reject(tx.error);
    });
  }
  function idbClear(store) {
    return new Promise((resolve, reject) => {
      const tx = db.transaction(store, 'readwrite');
      tx.objectStore(store).clear();
      tx.oncomplete = resolve; tx.onerror = () => reject(tx.error);
    });
  }
  function txDone(tx) {
    return new Promise((resolve, reject) => {
      tx.oncomplete = resolve; tx.onerror = () => reject(tx.error); tx.onabort = () => reject(tx.error);
    });
  }
  function genId() {
    return (crypto.randomUUID ? crypto.randomUUID() : Date.now() + '-' + Math.random().toString(36).slice(2));
  }

  // ── App state ─────────────────────────────────────────────
  let photosMeta   = [];   // all metadata, always in memory (cheap)
  let activeList   = [];   // filtered + sorted view for current render
  let renderedCount = 0;
  const PAGE_SIZE   = 60;  // DOM cards per batch (keeps 600+ photo galleries smooth)

  let sortKey    = 'added';
  let sortAsc    = true;
  let searchQuery = '';
  let densityIdx  = 1;
  const DENSITY   = [150, 195, 260];

  let lbIdx      = null;   // index into activeList
  let toastTimer = null;

  const thumbCache = new Map();   // id -> objectURL (kept for session)
  const fullCache  = new Map();   // id -> objectURL (small LRU, full-res is heavy)
  const FULL_CACHE_MAX = 6;

  let imgObserver, sentinelObserver;
  let touchStartX = null;

  // ── Thumbnail generation (client-side resize, once per upload) ──
  async function makeThumb(file, maxDim = 460, quality = 0.8) {
    try {
      const bitmap = await createImageBitmap(file);
      const scale = Math.min(1, maxDim / Math.max(bitmap.width, bitmap.height));
      const w = Math.max(1, Math.round(bitmap.width * scale));
      const h = Math.max(1, Math.round(bitmap.height * scale));
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(bitmap, 0, 0, w, h);
      if (bitmap.close) bitmap.close();
      const blob = await new Promise(res => canvas.toBlob(b => res(b), 'image/webp', quality));
      return blob || file;
    } catch {
      return file; // fallback: reuse original as thumb
    }
  }

  // ── Sort / filter ─────────────────────────────────────────
  function ext(n) { return n.split('.').pop().toLowerCase(); }

  function sortComparator(a, b) {
    let va, vb;
    switch (sortKey) {
      case 'name': va = a.name.toLowerCase(); vb = b.name.toLowerCase(); break;
      case 'size': va = a.size || 0;          vb = b.size || 0;          break;
      case 'type': va = ext(a.name);          vb = ext(b.name);          break;
      default:     va = a.seq;                vb = b.seq;                break;
    }
    return va < vb ? (sortAsc ? -1 : 1) : va > vb ? (sortAsc ? 1 : -1) : 0;
  }

  function computeList() {
    let list = photosMeta;
    if (searchQuery) {
      const q = searchQuery.toLowerCase();
      list = list.filter(p => p.name.toLowerCase().includes(q));
    }
    return [...list].sort(sortComparator);
  }

  function setSort(key) {
    if (sortKey === key) { toggleDir(); return; }
    sortKey = key;
    document.querySelectorAll('.sort-btn').forEach(b => b.classList.toggle('active', b.dataset.sort === key));
    resetAndRender();
  }
  function toggleDir() {
    sortAsc = !sortAsc;
    document.getElementById('sort-dir-btn').textContent = sortAsc ? '↓' : '↑';
    resetAndRender();
  }
  function setDensity(i) {
    densityIdx = i;
    document.querySelectorAll('.density-btn').forEach((b, idx) => b.classList.toggle('active', idx === i));
    document.getElementById('gallery').style.setProperty('--card-min', DENSITY[i] + 'px');
  }

  // ── Add photos ────────────────────────────────────────────
  async function addPhotos(fileList) {
    const imgs = Array.from(fileList).filter(f => f.type.startsWith('image/'));
    if (!imgs.length) { showToast('No image files found'); return; }

    const BATCH = 16;
    const total = imgs.length;
    let done = 0;
    const date = new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    let seq = photosMeta.length ? Math.max(...photosMeta.map(p => p.seq)) + 1 : 0;

    showProgress(0, total);

    for (let i = 0; i < imgs.length; i += BATCH) {
      const chunk = imgs.slice(i, i + BATCH);
      const thumbs = await Promise.all(chunk.map(f => makeThumb(f)));

      try {
        const tx = db.transaction(['meta', 'blobs'], 'readwrite');
        const metaStore = tx.objectStore('meta');
        const blobStore = tx.objectStore('blobs');
        const chunkMetas = [];
        chunk.forEach((f, j) => {
          const id = genId();
          const meta = { id, name: f.name, size: f.size, date, seq: seq++ };
          metaStore.put(meta);
          blobStore.put({ id, thumb: thumbs[j], full: f });
          chunkMetas.push(meta);
        });
        await txDone(tx);
        photosMeta.push(...chunkMetas);
      } catch {
        showToast('Storage error — device may be low on space');
        break;
      }

      done += chunk.length;
      showProgress(done, total);
      await new Promise(res => requestAnimationFrame(res));
    }

    hideProgress();
    showToast(`${done} photo${done !== 1 ? 's' : ''} added`);
    document.getElementById('fileInput').value = '';
    document.getElementById('folderInput').value = '';
    resetAndRender();
  }

  // ── Delete / clear ────────────────────────────────────────
  async function deletePhoto(id, e) {
    e && e.stopPropagation();
    await idbDelete('meta', id);
    await idbDelete('blobs', id);
    photosMeta = photosMeta.filter(p => p.id !== id);
    revoke(thumbCache, id); revoke(fullCache, id);
    closeLightbox();
    resetAndRender();
    showToast('Photo removed');
  }
  function revoke(cache, id) {
    if (cache.has(id)) { URL.revokeObjectURL(cache.get(id)); cache.delete(id); }
  }

  function confirmClear() {
    document.getElementById('confirm-msg').textContent =
      `This will permanently remove all ${photosMeta.length} photo${photosMeta.length !== 1 ? 's' : ''}. This cannot be undone.`;
    document.getElementById('confirm-overlay').showModal();
  }
  function closeConfirm() { const d = document.getElementById('confirm-overlay'); if (d.open) d.close(); }

  async function doClear() {
    closeConfirm();
    await idbClear('meta');
    await idbClear('blobs');
    thumbCache.forEach(u => URL.revokeObjectURL(u)); thumbCache.clear();
    fullCache.forEach(u => URL.revokeObjectURL(u));  fullCache.clear();
    photosMeta = [];
    resetAndRender();
    showToast('Showcase cleared');
  }

  // ── Random Mode (TikTok-style vertical swipe feed) ────────
  let rmCurrentId = null;
  let rmHistory   = [];   // ids shown before the current one, for swipe-down/back
  let rmQueue     = [];   // shuffled upcoming ids
  let rmActiveEl  = null;
  let rmBusy      = false;
  let rmTouchStartY = null;
  let rmWheelLock = false;

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function refillQueue() {
    let ids = activeList.map(p => p.id);
    if (rmCurrentId && ids.length > 1) ids = ids.filter(id => id !== rmCurrentId);
    rmQueue = shuffle(ids);
  }

  function nextRandomId() {
    if (!rmQueue.length) refillQueue();
    return rmQueue.shift();
  }

  function buildSlideEl() {
    const el = document.createElement('div');
    el.className = 'rm-slide';
    el.innerHTML = `<div class="rm-bgblur"></div><img class="rm-img" alt="" />`;
    return el;
  }

  async function paintSlide(el, id) {
    const p = photosMeta.find(x => x.id === id);
    const img = el.querySelector('.rm-img');
    const bg  = el.querySelector('.rm-bgblur');
    img.alt = p ? p.name : '';
    const thumbUrl = await getThumbUrl(id);
    if (el.isConnected === false) return; // slide was removed before it loaded
    if (thumbUrl) { img.src = thumbUrl; bg.style.backgroundImage = `url(${thumbUrl})`; }
    img.classList.add('loaded');
    if (rmCurrentId === id) document.getElementById('rm-name').textContent = p ? p.name : '';
    const fullUrl = await getFullUrl(id);
    if (fullUrl && img.isConnected) img.src = fullUrl;
  }

  function openRandomMode() {
    if (!activeList.length) return;
    const btn = document.getElementById('btn-random');
    btn.classList.add('spinning');
    setTimeout(() => btn.classList.remove('spinning'), 400);
    closeLightbox();
    document.getElementById('random-mode').classList.add('open');
    document.body.style.overflow = 'hidden';
    document.getElementById('rm-track').innerHTML = '';
    rmHistory = []; rmQueue = [];
    rmCurrentId = activeList[Math.floor(Math.random() * activeList.length)].id;
    const el = buildSlideEl();
    document.getElementById('rm-track').appendChild(el);
    rmActiveEl = el;
    paintSlide(el, rmCurrentId);
  }

  function closeRandomMode() {
    document.getElementById('random-mode').classList.remove('open');
    document.body.style.overflow = '';
    document.getElementById('rm-track').innerHTML = '';
    rmActiveEl = null; rmCurrentId = null; rmBusy = false;
  }

  async function rmGo(dir) {
    if (rmBusy || !activeList.length) return;
    let targetId;
    if (dir === 1) {
      targetId = nextRandomId();
      if (rmCurrentId) rmHistory.push(rmCurrentId);
    } else {
      if (!rmHistory.length) return;
      targetId = rmHistory.pop();
    }
    if (targetId == null) return;

    rmBusy = true;
    const newEl = buildSlideEl();
    newEl.classList.add(dir === 1 ? 'enter-from-bottom' : 'enter-from-top');
    document.getElementById('rm-track').appendChild(newEl);
    rmCurrentId = targetId;
    await paintSlide(newEl, targetId);

    void newEl.offsetWidth; // force reflow so the enter class is committed before we animate
    const oldEl = rmActiveEl;
    requestAnimationFrame(() => {
      newEl.classList.remove('enter-from-bottom', 'enter-from-top');
      if (oldEl) oldEl.classList.add(dir === 1 ? 'exit-to-top' : 'exit-to-bottom');
    });
    rmActiveEl = newEl;
    setTimeout(() => { if (oldEl) oldEl.remove(); rmBusy = false; }, 360);
  }

  function lbRandom() { closeLightbox(); openRandomMode(); }

  document.getElementById('random-mode').addEventListener('touchstart', e => {
    rmTouchStartY = e.touches[0].clientY;
  }, { passive: true });
  document.getElementById('random-mode').addEventListener('touchend', e => {
    if (rmTouchStartY === null) return;
    const dy = e.changedTouches[0].clientY - rmTouchStartY;
    if (Math.abs(dy) > 55) rmGo(dy < 0 ? 1 : -1);
    rmTouchStartY = null;
  }, { passive: true });
  document.getElementById('random-mode').addEventListener('wheel', e => {
    e.preventDefault();
    if (rmWheelLock) return;
    rmWheelLock = true;
    rmGo(e.deltaY > 0 ? 1 : -1);
    setTimeout(() => { rmWheelLock = false; }, 420);
  }, { passive: false });

  // ── Lazy thumb / full fetch ──────────────────────────────
  async function getThumbUrl(id) {
    if (thumbCache.has(id)) return thumbCache.get(id);
    const rec = await idbGet('blobs', id);
    if (!rec || !rec.thumb) return null;
    const url = URL.createObjectURL(rec.thumb);
    thumbCache.set(id, url);
    return url;
  }
  async function getFullUrl(id) {
    if (fullCache.has(id)) {
      const url = fullCache.get(id);
      fullCache.delete(id); fullCache.set(id, url);
      return url;
    }
    const rec = await idbGet('blobs', id);
    if (!rec || !rec.full) return null;
    const url = URL.createObjectURL(rec.full);
    fullCache.set(id, url);
    if (fullCache.size > FULL_CACHE_MAX) {
      const oldest = fullCache.keys().next().value;
      URL.revokeObjectURL(fullCache.get(oldest));
      fullCache.delete(oldest);
    }
    return url;
  }

  // ── Lightbox ──────────────────────────────────────────────
  function openLightboxFor(id) {
    const idx = activeList.findIndex(p => p.id === id);
    if (idx === -1) return;
    openLightbox(idx, true);
  }
  function openLightbox(idx, animate) {
    lbIdx = idx;
    document.getElementById('lightbox').classList.add('open');
    refreshLightbox(!!animate);
  }

  async function refreshLightbox(animate) {
    const p = activeList[lbIdx];
    if (!p) return;
    const myId = p.id;

    const img = document.getElementById('lb-img');
    const bg  = document.getElementById('lb-bgblur');
    document.getElementById('lb-name').textContent = p.name;
    document.getElementById('lb-pos').textContent   = `${lbIdx + 1} of ${activeList.length}`;

    if (animate) {
      const inner = document.getElementById('lb-inner');
      inner.style.animation = 'none';
      requestAnimationFrame(() => { inner.style.animation = ''; });
    }

    const showNav = activeList.length > 1;
    document.getElementById('lb-prev').style.visibility = showNav ? 'visible' : 'hidden';
    document.getElementById('lb-next').style.visibility = showNav ? 'visible' : 'hidden';

    // instant low-res placeholder
    const thumbUrl = await getThumbUrl(myId);
    if (lbIdx === null || activeList[lbIdx]?.id !== myId) return; // navigated away meanwhile
    if (thumbUrl) { img.src = thumbUrl; bg.style.backgroundImage = `url(${thumbUrl})`; }

    // swap in full resolution
    const fullUrl = await getFullUrl(myId);
    if (lbIdx === null || activeList[lbIdx]?.id !== myId) return;
    if (fullUrl) img.src = fullUrl;

    // quietly warm the next photo's full image for snappier nav
    const next = activeList[(lbIdx + 1) % activeList.length];
    if (next && next.id !== myId) getFullUrl(next.id);
  }

  function closeLightbox() {
    document.getElementById('lightbox').classList.remove('open');
    lbIdx = null;
  }
  function navLightbox(dir) {
    if (lbIdx === null || !activeList.length) return;
    lbIdx = (lbIdx + dir + activeList.length) % activeList.length;
    refreshLightbox(false);
  }

  // ── Keyboard / touch ──────────────────────────────────────
  document.addEventListener('keydown', e => {
    if (document.getElementById('confirm-overlay').open) return;
    if (document.getElementById('random-mode').classList.contains('open')) {
      if (e.key === 'Escape') closeRandomMode();
      else if (e.key === 'ArrowUp') rmGo(-1);
      else if (e.key === 'ArrowDown' || e.key === ' ') { e.preventDefault(); rmGo(1); }
      return;
    }
    if (!document.getElementById('lightbox').classList.contains('open')) return;
    if (e.key === 'ArrowRight') navLightbox(1);
    else if (e.key === 'ArrowLeft') navLightbox(-1);
    else if (e.key === 'Escape') closeLightbox();
  });
  const lbInner = document.getElementById('lb-inner');
  lbInner.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; }, { passive: true });
  lbInner.addEventListener('touchend', e => {
    if (touchStartX === null) return;
    const dx = e.changedTouches[0].clientX - touchStartX;
    if (Math.abs(dx) > 50) navLightbox(dx > 0 ? -1 : 1);
    touchStartX = null;
  }, { passive: true });

  // ── Drag & drop (anywhere on the page) ────────────────────
  window.addEventListener('dragover', e => e.preventDefault());
  window.addEventListener('drop', e => {
    e.preventDefault();
    if (e.dataTransfer && e.dataTransfer.files.length) addPhotos(e.dataTransfer.files);
  });

  // ── Progress / Toast ──────────────────────────────────────
  function showProgress(n, total) {
    document.getElementById('progress-wrap').classList.add('visible');
    document.getElementById('progress-fill').style.width = `${(n / total) * 100}%`;
    document.getElementById('progress-count').textContent = `${n} / ${total}`;
  }
  function hideProgress() { document.getElementById('progress-wrap').classList.remove('visible'); }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('visible');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('visible'), 2600);
  }

  // ── Helpers ───────────────────────────────────────────────
  function fmtSize(b) { return b > 1e6 ? (b / 1e6).toFixed(1) + ' MB' : Math.round(b / 1e3) + ' KB'; }
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

  // ── Rendering (paginated + lazy-loaded thumbnails) ───────
  function makeCard(p) {
    const card = document.createElement('div');
    card.className = 'photo-card'; card.tabIndex = 0; card.setAttribute('role', 'button'); card.setAttribute('aria-label', 'View ' + p.name);
    card.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target === card) openLightboxFor(p.id); });
    card.dataset.id = p.id;
    const n = esc(p.name);
    card.innerHTML = `
      <div class="photo-frame">
        <img alt="${n}" />
        <div class="photo-overlay">
          <div class="po-name">${n}</div>
          <div class="po-actions">
            <button class="po-btn view-btn">View</button>
            <button class="po-btn del">Remove</button>
          </div>
        </div>
      </div>
      <div class="photo-meta">
        <p>${n}</p>
        <p>${p.date} · ${fmtSize(p.size || 0)}</p>
      </div>`;
    card.querySelector('.view-btn').addEventListener('click', e => { e.stopPropagation(); openLightboxFor(p.id); });
    card.querySelector('.del').addEventListener('click', e => deletePhoto(p.id, e));
    card.addEventListener('click', () => openLightboxFor(p.id));
    imgObserver.observe(card);
    return card;
  }

  function loadMore() {
    if (renderedCount >= activeList.length) return;
    const next = activeList.slice(renderedCount, renderedCount + PAGE_SIZE);
    const frag = document.createDocumentFragment();
    next.forEach(p => frag.appendChild(makeCard(p)));
    document.getElementById('gallery').appendChild(frag);
    renderedCount += next.length;
  }

  function resetAndRender() {
    activeList = computeList();
    renderedCount = 0;
    document.getElementById('gallery').innerHTML = '';
    loadMore();
    updateChrome();
  }

  function lastAddedDate() {
    if (!photosMeta.length) return '—';
    return photosMeta.reduce((a, b) => (b.seq > a.seq ? b : a), photosMeta[0]).date;
  }

  function updateChrome() {
    const totalCount = photosMeta.length;
    const has = totalCount > 0;

    document.getElementById('collection-section').style.display = has ? 'block' : 'none';
    document.getElementById('empty').classList.toggle('visible', !has);

    document.getElementById('sec-count').textContent = searchQuery
      ? `${activeList.length} of ${totalCount} image${totalCount !== 1 ? 's' : ''}`
      : `${totalCount} image${totalCount !== 1 ? 's' : ''} · stored on this device`;

    const total = photosMeta.reduce((s, p) => s + (p.size || 0), 0);
    document.getElementById('stat-count').textContent = totalCount;
    document.getElementById('stat-size').textContent  = fmtSize(total);
    document.getElementById('stat-date').textContent  = lastAddedDate();
    document.getElementById('stats-bar').classList.toggle('visible', has);

    const many = totalCount > 1;
    document.getElementById('btn-clear').style.display    = has  ? '' : 'none';
    document.getElementById('btn-random').style.display   = many ? '' : 'none';
    document.getElementById('rand-divider').style.display = many ? '' : 'none';

    const noResults = has && activeList.length === 0;
    document.getElementById('no-results').classList.toggle('visible', noResults);
    if (noResults) document.getElementById('nr-sub').textContent = `Nothing found for “${searchQuery}”`;
  }

  // ── Observers ─────────────────────────────────────────────
  function setupObservers() {
    imgObserver = new IntersectionObserver(entries => {
      entries.forEach(async entry => {
        if (!entry.isIntersecting) return;
        imgObserver.unobserve(entry.target);
        const id = entry.target.dataset.id;
        const url = await getThumbUrl(id);
        if (url) {
          const img = entry.target.querySelector('img');
          img.addEventListener('load', () => entry.target.classList.add('loaded'), { once: true });
          img.src = url;
        }
      });
    }, { rootMargin: '450px 0px' });

    sentinelObserver = new IntersectionObserver(entries => {
      if (entries[0].isIntersecting && renderedCount < activeList.length) loadMore();
    }, { rootMargin: '600px 0px' });
    sentinelObserver.observe(document.getElementById('scroll-sentinel'));
  }

  document.getElementById('search-input').addEventListener('input', e => {
    searchQuery = e.target.value.trim();
    resetAndRender();
  });

  // ── Init ──────────────────────────────────────────────────
  async function init() {
    try {
      db = await openDB();
      photosMeta = await idbGetAll('meta');
    } catch {
      showToast('This browser does not support local storage');
    }
    setupObservers();
    resetAndRender();
  }
  // ── Colour theme (Sanzo Wada combinations) ────────────────
  const THEME_BG = { ink: '#111314', slate: '#112f2c', olive: '#253122' };
  function applyTheme(t, save) {
    if (!THEME_BG[t]) t = 'ink';
    document.documentElement.dataset.theme = t;
    document.querySelector('meta[name=theme-color]').content = THEME_BG[t];
    document.getElementById('theme-select').value = t;
    if (save) { try { localStorage.setItem('framed-theme', t); } catch (e) {} }
  }
  document.getElementById('theme-select').addEventListener('change', e => applyTheme(e.target.value, true));
  try { applyTheme(localStorage.getItem('framed-theme') || 'ink'); } catch (e) { applyTheme('ink'); }
  init();
</script>
</body>
</html>
